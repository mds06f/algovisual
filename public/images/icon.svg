<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg-grad)" />
  <!-- Abstract visualizer graphic -->
  <g filter="url(#glow)">
    <line x1="160" y1="352" x2="256" y2="160" stroke="#00e1d9" stroke-width="8" stroke-linecap="round" />
    <line x1="256" y1="160" x2="352" y2="352" stroke="#7c3aed" stroke-width="8" stroke-linecap="round" />
    <line x1="160" y1="352" x2="352" y2="352" stroke="#22d3ee" stroke-dasharray="8,8" stroke-width="4" stroke-linecap="round" />
    
    <circle cx="256" cy="160" r="28" fill="url(#purple-grad)" stroke="#a78bfa" stroke-width="4" />
    <circle cx="160" cy="352" r="24" fill="url(#cyan-grad)" stroke="#22d3ee" stroke-width="4" />
    <circle cx="352" cy="352" r="24" fill="url(#cyan-grad)" stroke="#22d3ee" stroke-width="4" />
  </g>
</svg>
